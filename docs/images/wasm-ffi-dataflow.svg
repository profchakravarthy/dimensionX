<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace">
  <defs>
    <linearGradient id="bgFfi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrRight" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrLeft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="1200" height="600" rx="14" fill="url(#bgFfi)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">Rust WebAssembly C-ABI &amp; Linear Memory Handoff Protocol</text>
  <text x="600" y="60" text-anchor="middle" fill="#94a3b8" font-size="13">How JavaScript controls the Rust Universe via 16 extern "C" exports and reads telemetry from WebAssembly.Memory</text>

  <!-- Left Column: JS Browser Runtime -->
  <rect x="40" y="88" width="360" height="480" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
  <rect x="40" y="88" width="360" height="34" rx="10" fill="#0284c7"/>
  <text x="220" y="110" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">JS Browser Layer (RustWasmBridge.js)</text>

  <rect x="58" y="138" width="324" height="110" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="72" y="158" fill="#7dd3fc" font-size="12.5" font-weight="700">1. Lifecycle &amp; Seeding Calls</text>
  <text x="72" y="178" fill="#e2e8f0" font-size="11.5">• WebAssembly.instantiateStreaming(wasm)</text>
  <text x="72" y="196" fill="#e2e8f0" font-size="11.5">• universe_init(maxDim=6, scale=1.0, seed)</text>
  <text x="72" y="214" fill="#e2e8f0" font-size="11.5">• universe_seed_default(16, 3, 1)</text>
  <text x="72" y="232" fill="#e2e8f0" font-size="11.5">• universe_set_include_worldlines(0 | 1)</text>

  <rect x="58" y="264" width="324" height="136" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="72" y="284" fill="#7dd3fc" font-size="12.5" font-weight="700">2. Per-Frame &amp; Interactive Controls</text>
  <text x="72" y="304" fill="#e2e8f0" font-size="11.5">• rAF Loop: universe_step(realDeltaSeconds)</text>
  <text x="72" y="322" fill="#4ade80" font-size="11.5">• − Slow Button: universe_slow_down_time()</text>
  <text x="72" y="340" fill="#4ade80" font-size="11.5">• + Fast Button: universe_speed_up_time()</text>
  <text x="72" y="358" fill="#e2e8f0" font-size="11.5">• Slice Slider: universe_set_slice_z(z)</text>
  <text x="72" y="376" fill="#e2e8f0" font-size="11.5">• Phase Jump: universe_jump_being_to_dimension</text>
  <text x="72" y="392" fill="#e2e8f0" font-size="11.5">• Pulse/Spawn: trigger_injection / spawn_being</text>

  <rect x="58" y="416" width="324" height="134" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="72" y="436" fill="#c4b5fd" font-size="12.5" font-weight="700">3. Zero-Copy Linear Memory Decode</text>
  <text x="72" y="456" fill="#e2e8f0" font-size="11.5">const len = wasm.universe_refresh_snapshot();</text>
  <text x="72" y="474" fill="#e2e8f0" font-size="11.5">const ptr = wasm.universe_get_snapshot_ptr();</text>
  <text x="72" y="492" fill="#38bdf8" font-size="11.5">const bytes = new Uint8Array(</text>
  <text x="84" y="508" fill="#38bdf8" font-size="11.5">wasm.memory.buffer, ptr, len</text>
  <text x="72" y="524" fill="#38bdf8" font-size="11.5">);</text>
  <text x="72" y="541" fill="#4ade80" font-size="11.5">const snap = JSON.parse(decoder.decode(bytes));</text>

  <!-- Right Column: Rust WASM Module -->
  <rect x="520" y="88" width="640" height="480" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="1.8"/>
  <rect x="520" y="88" width="640" height="34" rx="10" fill="#ea580c"/>
  <text x="840" y="110" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Rust WebAssembly Module (rust-core/src/wasm_api.rs &amp; universe.rs)</text>

  <rect x="540" y="138" width="600" height="110" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1"/>
  <text x="556" y="158" fill="#fdba74" font-size="12.5" font-weight="700">Global Singleton State in WASM Linear Memory</text>
  <text x="556" y="178" fill="#e2e8f0" font-size="11.5">• static mut UNIVERSE: Option&lt;DimensionXUniverse&gt; (single-threaded WASM32 execution)</text>
  <text x="556" y="198" fill="#e2e8f0" font-size="11.5">• static mut SNAPSHOT_BUFFER: Vec&lt;u8&gt; (reused UTF-8 byte buffer across frames)</text>
  <text x="556" y="218" fill="#cbd5e1" font-size="11.5">• Deterministic Mulberry32 PRNG + SpaceTimeClock + Vec&lt;BeingEntity&gt; + Vec&lt;InformationPulseEntity&gt;</text>

  <rect x="540" y="264" width="600" height="136" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1"/>
  <text x="556" y="284" fill="#fdba74" font-size="12.5" font-weight="700">16 Exported #[no_mangle] pub extern "C" Functions (wasm_api.rs)</text>
  <text x="556" y="306" fill="#e2e8f0" font-size="11">1. universe_init(max_dim, scale, seed)</text>
  <text x="850" y="306" fill="#e2e8f0" font-size="11">9.  universe_get_universal_time() -&gt; f64</text>
  <text x="556" y="324" fill="#e2e8f0" font-size="11">2. universe_seed_default(c2, c3, c4) -&gt; u32</text>
  <text x="850" y="324" fill="#e2e8f0" font-size="11">10. universe_get_tick_count() -&gt; u32</text>
  <text x="556" y="342" fill="#e2e8f0" font-size="11">3. universe_spawn_being(dim, fam, sides, e)</text>
  <text x="850" y="342" fill="#e2e8f0" font-size="11">11. universe_get_being_count() -&gt; u32</text>
  <text x="556" y="360" fill="#e2e8f0" font-size="11">4. universe_step(real_dt) -&gt; u32</text>
  <text x="850" y="360" fill="#e2e8f0" font-size="11">12. universe_set_slice_z(slice_z: f64)</text>
  <text x="556" y="378" fill="#e2e8f0" font-size="11">5. universe_step_ticks(count) -&gt; u32</text>
  <text x="850" y="378" fill="#e2e8f0" font-size="11">13. universe_set_include_worldlines(u32)</text>
  <text x="556" y="394" fill="#4ade80" font-size="11">6–8. set_time_scale / slow_down / speed_up</text>
  <text x="850" y="394" fill="#38bdf8" font-size="11">14–16. trigger / jump / refresh_snapshot</text>

  <rect x="540" y="416" width="600" height="134" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="556" y="436" fill="#c4b5fd" font-size="12.5" font-weight="700">JSON Snapshot Schema Written to SNAPSHOT_BUFFER (to_snapshot_json)</text>
  <text x="556" y="456" fill="#e2e8f0" font-size="11.5">• Telemetry: universalTime, tickCount, timeScale, paused, maxUnlockedDimension, viewerSliceZ</text>
  <text x="556" y="475" fill="#e2e8f0" font-size="11.5">• Population &amp; Epistemics: populationByDimension {2..6}, discoveredAxioms []</text>
  <text x="556" y="494" fill="#38bdf8" font-size="11.5">• Beings []: id, activeDimension, maxDimension, phaseState, family, schlafliSymbol,</text>
  <text x="568" y="511" fill="#38bdf8" font-size="11.5">position, vertices (world R^N), edges, facets, activeLinks, crossSection, sliceAtZ, worldline</text>
  <text x="556" y="530" fill="#fbbf24" font-size="11.5">• Events &amp; Wavefronts: pulses [], ascensionLog [] (≤64), recentEvents [] (≤80)</text>

  <!-- Bidirectional Arrows Between JS and WASM -->
  <line x1="400" y1="192" x2="518" y2="192" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrRight)"/>
  <text x="459" y="184" text-anchor="middle" fill="#7dd3fc" font-size="10.5" font-weight="600">C-ABI Init</text>

  <line x1="400" y1="332" x2="518" y2="332" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrRight)"/>
  <text x="459" y="324" text-anchor="middle" fill="#7dd3fc" font-size="10.5" font-weight="600">60 Hz Commands</text>

  <line x1="518" y1="482" x2="400" y2="482" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrLeft)"/>
  <text x="459" y="472" text-anchor="middle" fill="#c4b5fd" font-size="10.5" font-weight="600">ptr + byteLen</text>
  <text x="459" y="498" text-anchor="middle" fill="#94a3b8" font-size="10">(wasm.memory)</text>
</svg>

