<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace">
  <defs>
    <linearGradient id="bgTick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrowFlow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="14" fill="url(#bgTick)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <text x="600" y="38" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">Deterministic Fixed-Quantum Simulation Tick Pipeline (DimensionXUniverse::step_single_tick)</text>
  <text x="600" y="60" text-anchor="middle" fill="#94a3b8" font-size="13">Executed in strict order inside rust-core/src/universe.rs for every fixed quantum δt = 1/60 s of Universal Proper Time T</text>

  <!-- Clock Accumulator Entry Box -->
  <rect x="40" y="84" width="1120" height="72" rx="10" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="62" y="110" fill="#c4b5fd" font-size="14" font-weight="700">0. Universal Space-Time Clock Accumulator (SpaceTimeClock::advance_real_time in rust-core/src/spacetime.rs)</text>
  <text x="62" y="132" fill="#e2e8f0" font-size="12">scaled_delta = real_dt × time_scale (0× paused | 0.05×..0.5× slow-mo | 1.0× base proper time | 2×..1000× hyper-warp)</text>
  <text x="62" y="148" fill="#38bdf8" font-size="11.5">Executes n = floor(accumulator / δt) discrete ticks (capped at max_sub_steps_per_frame = 600), advancing T ← T + δt per tick</text>

  <!-- Row 1: Systems 1, 2, 3 -->
  <!-- System 1 -->
  <rect x="40" y="190" width="350" height="175" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.6"/>
  <rect x="40" y="190" width="350" height="30" rx="10" fill="#0284c7"/>
  <text x="55" y="210" fill="#ffffff" font-size="13" font-weight="700">System 1: step_kinematics_nd(dt)</text>
  <text x="55" y="236" fill="#e2e8f0" font-size="11.5">• Updates position x_0..x_{k-1} += v_0..v_{k-1} · dt</text>
  <text x="55" y="255" fill="#e2e8f0" font-size="11.5">• Confines orthogonal axes x_k..x_{N-1} = 0</text>
  <text x="65" y="271" fill="#94a3b8" font-size="11">(2D beings never drift into z/w until ascension)</text>
  <text x="55" y="290" fill="#e2e8f0" font-size="11.5">• Enforces Reflective or Toroidal boundaries</text>
  <text x="55" y="309" fill="#e2e8f0" font-size="11.5">• Applies SO(k) plane rotations R_{i,j}(ω·dt)</text>
  <text x="55" y="328" fill="#4ade80" font-size="11.5">• Gram-Schmidt reorthogonalize() every 60 ticks</text>
  <text x="55" y="347" fill="#cbd5e1" font-size="11">• Adds passive metabolic energy (+8.0/s)</text>

  <!-- System 2 -->
  <rect x="425" y="190" width="350" height="175" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.6"/>
  <rect x="425" y="190" width="350" height="30" rx="10" fill="#d97706"/>
  <text x="440" y="210" fill="#ffffff" font-size="13" font-weight="700">System 2: step_higher_dim_injection(dt)</text>
  <text x="440" y="236" fill="#e2e8f0" font-size="11.5">• Higher-D beings (k &gt; 2) emit causal pulses</text>
  <text x="450" y="252" fill="#94a3b8" font-size="11">into (k-1)-D hyperplane every 3.0s proper time</text>
  <text x="440" y="271" fill="#e2e8f0" font-size="11.5">• Wavefronts expand at c_info = 14.0 units/s</text>
  <text x="440" y="290" fill="#e2e8f0" font-size="11.5">• Annular shell contact [r - w, r + w] transfers</text>
  <text x="450" y="306" fill="#cbd5e1" font-size="11">higher-D geometric axiom (e.g. DIM3_EULER_CLOSURE)</text>
  <text x="440" y="326" fill="#fbbf24" font-size="11.5">• Emits INFO_INJECTED &amp; AXIOM_ABSORBED events</text>
  <text x="440" y="346" fill="#cbd5e1" font-size="11">• Prunes pulses once current_radius &gt; max_radius</text>

  <!-- System 3 -->
  <rect x="810" y="190" width="350" height="175" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.6"/>
  <rect x="810" y="190" width="350" height="30" rx="10" fill="#7e22ce"/>
  <text x="825" y="210" fill="#ffffff" font-size="13" font-weight="700">System 3: step_peer_exchange(dt)</text>
  <text x="825" y="236" fill="#e2e8f0" font-size="11.5">• Decays exchange_cooldown and prunes expired</text>
  <text x="835" y="252" fill="#94a3b8" font-size="11">collaboration_links (&gt; 1.2s proper-time age)</text>
  <text x="825" y="271" fill="#e2e8f0" font-size="11.5">• Pairs in same active_dimension within r_comm=6.5</text>
  <text x="835" y="287" fill="#cbd5e1" font-size="11">exchange up to 2 missing geometric axioms</text>
  <text x="825" y="307" fill="#e2e8f0" font-size="11.5">• Calls upsert_collaboration_link (capped ≤ 8)</text>
  <text x="825" y="327" fill="#4ade80" font-size="11.5">• Grants +energy_gain_per_exchange (1.5) only</text>
  <text x="835" y="343" fill="#4ade80" font-size="11">when new knowledge is genuinely transferred</text>

  <!-- Row 2: Systems 4, 5, 6 -->
  <!-- System 4 -->
  <rect x="40" y="405" width="350" height="180" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.6"/>
  <rect x="40" y="405" width="350" height="30" rx="10" fill="#be185d"/>
  <text x="55" y="425" fill="#ffffff" font-size="13" font-weight="700">System 4: step_inheritance_mutation()</text>
  <text x="55" y="451" fill="#e2e8f0" font-size="11.5">• Triggered when energy ≥ reproduction_threshold</text>
  <text x="65" y="467" fill="#94a3b8" font-size="11">(100.0) and dimension pop &lt; max_pop (45)</text>
  <text x="55" y="486" fill="#e2e8f0" font-size="11.5">• Splits parent energy 50% / 45% to offspring</text>
  <text x="55" y="505" fill="#e2e8f0" font-size="11.5">• Offspring inherits parent's known_axioms</text>
  <text x="55" y="524" fill="#f472b6" font-size="11.5">• Structural mutation (p=0.35): polygon sides</text>
  <text x="65" y="540" fill="#cbd5e1" font-size="11">{p±1} or 3D+ family cycle (Simplex/Cube/Orthoplex)</text>
  <text x="55" y="560" fill="#fbbf24" font-size="11.5">• Epistemic mutation (p=0.20): novel (k+1)-D axiom</text>

  <!-- System 5 -->
  <rect x="425" y="405" width="350" height="180" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.6"/>
  <rect x="425" y="405" width="350" height="30" rx="10" fill="#047857"/>
  <text x="440" y="425" fill="#ffffff" font-size="13" font-weight="700">System 5: step_collaborative_folding()</text>
  <text x="440" y="451" fill="#e2e8f0" font-size="11.5">• Checks target_dim (k+1) pop cap up front</text>
  <text x="440" y="470" fill="#e2e8f0" font-size="11.5">• Forms cluster within folding_radius (8.0) when</text>
  <text x="450" y="486" fill="#cbd5e1" font-size="11">union of axioms covers all 4 DIM(k+1)_* axioms</text>
  <text x="440" y="505" fill="#34d399" font-size="11.5">• Synthesizes (k+1)-D PolytopeND (Simplex,</text>
  <text x="450" y="521" fill="#34d399" font-size="11">Hypercube, or Orthoplex) &amp; RotorND(N)</text>
  <text x="440" y="541" fill="#e2e8f0" font-size="11.5">• Sets active_dimension = max_dimension = k+1</text>
  <text x="440" y="560" fill="#e2e8f0" font-size="11.5">• Lifts off along newly unlocked axis x_k &gt; 0</text>

  <!-- System 6 + Worldlines -->
  <rect x="810" y="405" width="350" height="180" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.6"/>
  <rect x="810" y="405" width="350" height="30" rx="10" fill="#0e7490"/>
  <text x="825" y="425" fill="#ffffff" font-size="13" font-weight="700">System 6: Phasing &amp; Worldline Sampling</text>
  <text x="825" y="451" fill="#e2e8f0" font-size="11.5">• Native M-D beings project observation cone</text>
  <text x="835" y="467" fill="#cbd5e1" font-size="11">onto lower dimensions (PhaseState::Observing)</text>
  <text x="825" y="486" fill="#e2e8f0" font-size="11.5">• PhasedDown beings (m &lt; M) compute live</text>
  <text x="835" y="502" fill="#38bdf8" font-size="11">compute_being_cross_section(b, m, 0.0) slice</text>
  <text x="825" y="522" fill="#e2e8f0" font-size="11.5">• Auto-returns to M-D after phase_residence_time</text>
  <text x="825" y="544" fill="#4ade80" font-size="11.5">• sample_worldlines(): records (T, pos, dim)</text>
  <text x="835" y="560" fill="#94a3b8" font-size="11">into ring buffer every 0.25s proper time</text>

  <!-- Flow Arrows -->
  <line x1="215" y1="156" x2="215" y2="188" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrowFlow)"/>
  <line x1="390" y1="277" x2="423" y2="277" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrowFlow)"/>
  <line x1="775" y1="277" x2="808" y2="277" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrowFlow)"/>
  <path d="M 985 365 L 985 385 L 215 385 L 215 403" fill="none" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrowFlow)"/>
  <line x1="390" y1="495" x2="423" y2="495" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrowFlow)"/>
  <line x1="775" y1="495" x2="808" y2="495" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
</svg>
